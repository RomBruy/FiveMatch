services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fivematch_test
      POSTGRES_USER: fivematch_test
      POSTGRES_PASSWORD: fivematch_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fivematch_test -d fivematch_test"]
      interval: 2s
      timeout: 3s
      retries: 20

