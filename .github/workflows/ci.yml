name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fivematch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and test
        run: pnpm turbo lint test

      - name: Run isolated integration tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fivematch_test
        run: |
          pnpm --filter @fivematch/api db:migrate:test
          pnpm --filter @fivematch/api test:integration
          # test:integration uses vitest.integration.config.ts — runs only integration tests
